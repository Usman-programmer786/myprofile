{% extends "base.html" %}

{% block content %}

<div class="settings-page">

    <div class="settings-card">

        <h1>Admin Settings</h1>

        <p class="settings-subtitle">
            Change your admin account details.
        </p>

        {% if error %}
            <div class="settings-error">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="settings-success">
                {{ success }}
            </div>
        {% endif %}

        <form action="/settings" method="post">

          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
          <div class="current-account">
              <p>Current Username</p>
              <strong>{{ session["username"] }}</strong>
          </div>
      
          <label for="new_username">
              New Username
          </label>

            <input
                id="new_username"
                type="text"
                name="new_username"
                placeholder="Leave blank if you only want to change password"
            >

            <label for="current_password">
                Current Password
            </label>

            <input
                id="current_password"
                type="password"
                name="current_password"
                placeholder="Enter current password"
                required
            >

            <label for="new_password">
                New Password
            </label>

            <input
                id="new_password"
                type="password"
                name="new_password"
                placeholder="Leave blank if you only want to change username"
            >

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                id="confirm_password"
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
            >

            <button type="submit">
                Save Changes
            </button>

        </form>

        <a href="/admin" class="back-admin">
            ← Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
